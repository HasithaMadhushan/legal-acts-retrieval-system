name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: python -m ruff check app alembic

      - name: Test (pytest)
        # app/tests/conftest.py sets DATABASE_URL/SECRET_KEY/UPLOAD_DIR/etc. itself
        # (SQLite, PyMuPDF-only) so tests need no external services or secrets.
        run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=50

  pgvector:
    name: PostgreSQL (Alembic + pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: legal_acts
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: legal_acts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U legal_acts -d legal_acts_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://legal_acts@127.0.0.1:5432/legal_acts_test
      PGVECTOR_TEST_DATABASE_URL: postgresql+psycopg://legal_acts@127.0.0.1:5432/legal_acts_test
      ENVIRONMENT: test
      SECRET_KEY: pgvector-ci-secret
      EMBEDDING_PROVIDER: hash-test
      SEMANTIC_SEARCH_ENABLED: "false"
      AUTO_MIGRATE_ON_STARTUP: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        # Direct dependencies are exact-version pinned in requirements.txt.
        run: "pip install --only-binary :all: -r requirements.txt" # NOSONAR

      - name: Upgrade empty PostgreSQL database
        run: alembic upgrade head

      - name: Verify native vector retrieval and HNSW
        run: python -m pytest app/tests/test_pgvector_search.py -v

  frontend:
    name: Frontend (typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test (vitest)
        run: npm test

      - name: Build
        run: npm run build
