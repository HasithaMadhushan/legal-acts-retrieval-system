services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: legal_acts
      POSTGRES_USER: legal_acts
      POSTGRES_PASSWORD: legal_acts
    # No host port mapping: a system PostgreSQL often occupies 127.0.0.1:5432,
    # which would make `docker compose up` fail with "address already in use".
    # The backend reaches this service over the compose network as hostname
    # "db"; use `docker compose exec db psql ...` for ad-hoc access.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal_acts"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://legal_acts:legal_acts@db:5432/legal_acts
      ENVIRONMENT: development
      # Local/dev only. Override SECRET_KEY with a unique value for any non-development
      # environment; the app refuses to start if ENVIRONMENT=production with this default.
      SECRET_KEY: change-this-development-secret
      UPLOAD_DIR: /app/uploads
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      LOG_LEVEL: INFO
      # "console" is human-friendly for local dev; use "json" in real deployments
      # so log aggregators (e.g. CloudWatch, Loki) can parse each line.
      LOG_FORMAT: console
      # Optional: set SENTRY_DSN to enable error tracking. Left unset here since
      # this is a local/dev compose file.
      # SENTRY_DSN: ""
      # Gunicorn worker count (see backend/Dockerfile); 2 is plenty for local dev.
      # WEB_CONCURRENCY: "2"
      # LLM hybrid extraction stays off until gold-set eval beats regex-only.
      # LLM_EXTRACTION_ENABLED: "false"
      # LLM_PROVIDER: gemini
      # LLM_MODEL: gemini-2.0-flash
      # LLM_API_KEY: ""
      # Semantic search stays off until retrieval eval beats keyword search.
      # SEMANTIC_SEARCH_ENABLED: "false"
      # ENABLE_PGVECTOR: "false"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the client bundle at build time -- see frontend/Dockerfile.
        # 127.0.0.1 is correct here because in local dev the browser and the
        # backend are both reached via the host machine.
        NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000/api/v1
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
