services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: legal_acts
      POSTGRES_USER: legal_acts
      POSTGRES_PASSWORD: legal_acts
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal_acts"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://legal_acts:legal_acts@db:5432/legal_acts
      ENVIRONMENT: development
      # Local/dev only. Override SECRET_KEY with a unique value for any non-development
      # environment; the app refuses to start if ENVIRONMENT=production with this default.
      SECRET_KEY: change-this-development-secret
      UPLOAD_DIR: /app/uploads
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
