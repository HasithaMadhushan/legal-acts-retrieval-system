sonar.projectKey=HasithaMadhushan_legal-acts-retrieval-system
sonar.organization=hasithamadhushan

# Generated / vendored UI primitives (shadcn) inflate duplication without
# reflecting application-authored code quality.
sonar.exclusions=**/node_modules/**,**/.next/**,**/frontend/components/ui/**,backend/Dockerfile
sonar.coverage.exclusions=**/frontend/components/ui/**,**/alembic/**,**/tests/**

# Sonar's Docker analyzer treats exact direct pins as unlocked because the
# transitive dependency graph does not carry hashes. Dockerfile syntax and
# build checks run in CI; publishing remains gated on a digest-pinned image.
