sonar.projectKey=HasithaMadhushan_legal-acts-retrieval-system
sonar.organization=hasithamadhushan

# Generated / vendored UI primitives (shadcn) inflate duplication without
# reflecting application-authored code quality.
sonar.exclusions=**/node_modules/**,**/.next/**,**/frontend/components/ui/**
sonar.coverage.exclusions=**/frontend/components/ui/**,**/alembic/**,**/tests/**

# requirements.txt exact-pins every direct dependency. Transitive resolution is
# frozen by the published image digest; Sonar does not recognize that image
# boundary as a lockfile. Keep this exception scoped to that single install
# block so every other Dockerfile finding remains active.
sonar.issue.ignore.block=e1
sonar.issue.ignore.block.e1.beginBlockRegexp=sonar-ignore-dependency-lock-start
sonar.issue.ignore.block.e1.endBlockRegexp=sonar-ignore-dependency-lock-end
